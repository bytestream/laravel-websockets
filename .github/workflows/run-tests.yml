name: 'Tests'

on:
  push:
  pull_request:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11', '12']

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
    - uses: actions/checkout@v1

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: pcov

    - name: Setup Redis
      uses: supercharge/redis-github-action@1.1.0
      with:
        redis-version: 6

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: composer-php-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}

    - name: Setup Problem Matchers
      run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Select Laravel 11
      uses: nick-invision/retry@v2.8.2
      with:
        timeout_minutes: 5
        max_attempts: 5
        command: composer require "laravel/framework:11.*" --no-update --no-interaction
      if: "matrix.laravel == '11'"

    - name: Install PHP Dependencies
      uses: nick-invision/retry@v2.8.2
      with:
        timeout_minutes: 5
        max_attempts: 5
        command: composer update --no-interaction --no-progress

    - name: Run tests for Local
      run: |
        REPLICATION_MODE=local vendor/bin/phpunit --coverage-text --coverage-clover=coverage_local.xml

    - name: Run tests for Redis
      run: |
        REPLICATION_MODE=redis vendor/bin/phpunit --coverage-text --coverage-clover=coverage_redis.xml

    - uses: codecov/codecov-action@v1
      with:
        fail_ci_if_error: false
        file: '*.xml'
        token: ${{ secrets.CODECOV_TOKEN }}
